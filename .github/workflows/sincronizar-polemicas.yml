name: Sincronizar Polémicas

on:
  schedule:
    - cron: '0 * * * *'  # Cada hora
  workflow_dispatch:  # También se puede lanzar manualmente

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar polémicas de LaLiga
        run: |
          node -e "
          const SUPABASE_URL = 'https://hdkcyzbywdfoqwpmypoc.supabase.co';
          const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhka2N5emJ5d2Rmb3F3cG15cG9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzMxMDMsImV4cCI6MjA5NTAwOTEwM30.M3LlU4OzH8J8S7-N7CIVi0ovts5hQ1CrkFhfcXIlmr4';
          const FOOTBALL_KEY = '024d98339ac040aa81e415079c09300f';

          async function main() {
            const hoy = new Date();
            const hace7dias = new Date(hoy - 7 * 24 * 60 * 60 * 1000);
            const dateFrom = hace7dias.toISOString().split('T')[0];
            const dateTo = hoy.toISOString().split('T')[0];

            const res = await fetch('https://api.football-data.org/v4/competitions/PD/matches?dateFrom=' + dateFrom + '&dateTo=' + dateTo + '&status=FINISHED', {
              headers: { 'X-Auth-Token': FOOTBALL_KEY }
            });
            const data = await res.json();
            const partidos = data.matches || [];

            for (const partido of partidos) {
              const local = partido.homeTeam.shortName || partido.homeTeam.name;
              const visitante = partido.awayTeam.shortName || partido.awayTeam.name;
              const nombrePartido = local + ' vs ' + visitante;
              const jornada = partido.matchday || 1;
              const marcador = partido.score?.fullTime;
              const golesLocal = marcador?.home ?? 0;
              const golesVisitante = marcador?.away ?? 0;

              const candidatas = [];

              const rojas = partido.bookings?.filter(b => b.card === 'RED_CARD') || [];
              rojas.forEach(roja => {
                candidatas.push({
                  partido: nombrePartido,
                  titulo: 'Roja directa a ' + (roja.player?.name || 'jugador') + ' — ¿merecida?',
                  descripcion: 'Expulsión directa en el minuto ' + roja.minute + ' que condicionó el partido.',
                  minuto: String(roja.minute),
                  jornada
                });
              });

              if (Math.abs(golesLocal - golesVisitante) === 1) {
                candidatas.push({
                  partido: nombrePartido,
                  titulo: 'Resultado ajustado en ' + nombrePartido + ' — ¿hubo mano en el área?',
                  descripcion: 'Partido decidido por la mínima (' + golesLocal + '-' + golesVisitante + '). Los aficionados debaten si hubo una mano no pitada.',
                  minuto: '75',
                  jornada
                });
              }

              for (const c of candidatas) {
                const check = await fetch(SUPABASE_URL + '/rest/v1/polemicas_candidatas?partido=eq.' + encodeURIComponent(c.partido) + '&titulo=eq.' + encodeURIComponent(c.titulo), {
                  headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
                const existe = await check.json();
                if (existe.length === 0) {
                  await fetch(SUPABASE_URL + '/rest/v1/polemicas_candidatas', {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify(c)
                  });
                  console.log('Candidata creada:', c.titulo);
                }
              }
            }
            console.log('Sincronización completada');
          }

          main().catch(console.error);
          "